<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advent Calendar</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Livvic:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container ">
    <header>
      <h1 class="text-center text-white">Advent Calendar <br> 2024</h1>
    </header>
    <main class="d-flex flex-column">
      <div class="wrap d-flex flex-wrap justify-content-center" id="output"></div>
      <button class="btn btn-danger mb-3" id="resetBtn">Restart</button>

    </main>
  </div>
  <div class="blur d-flex justify-content-center align-items-center d-none" id="blur">
    <div class="popup d-flex flex-column justify-content-center align-items-center" id="popup"></div>
  </div>
  <script type="module" src="script.js"></script>
</body>
</html>
